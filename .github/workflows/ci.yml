name: CI

# Phase 0 CI: enforce the plumb-line guardrails on every push/PR.
#   - pytest (contract validators + layering guardrail)
#   - lint-imports (audit P2 one-way layering, machine-enforced)
# Matrix is ubuntu + macos + windows. Windows measures the suite, not the
# product: crr still has no boot-identity adapter there (#75) and no
# process probe beyond is_alive (#74), so ~30 tests skip with that reason
# named. A green Windows job means the code is portable, not that crr runs.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # windows-latest rejoins here (#72). It was held out while the suite
        # could not pass there; a permanently red job trains people to
        # ignore CI, which is how #65 stayed broken for weeks. Keeping it
        # out had the mirror-image cost: nothing measured Windows, so #70's
        # regressions were invisible until someone went looking.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # [#43] Shim tests run on any POSIX host now, not Linux only — macOS
      # defaults to zsh, so gating them on Linux left the layer every
      # session passes through unverified there. Install the shells the
      # runner lacks so they are actually exercised rather than skipped.
      - name: Install shells for shim tests (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish

      - name: Install shells for shim tests (macOS)
        if: runner.os == 'macOS'
        run: brew install fish

      - name: Install (dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Layering contract (import-linter)
        run: lint-imports

      - name: Tests
        run: pytest -q

  # Page-JS syntax gate (DESIGN.md: "a served page is not verifiable by
  # curl"). Now that a page exists, the real gate is a pytest test
  # (test_web.py::test_page_scripts_pass_node_check) that extracts every
  # <script> block and runs `node --check`; it runs in the matrix job above
  # (the runners ship node). This job is a redundant explicit check on
  # ubuntu so a node regression is obvious in the checks list.
  page-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: node --check every served <script> block
        run: |
          node --version
          pytest -q tests/test_web.py -k node_check
