name: CI

# Phase 0 CI: enforce the plumb-line guardrails on every push/PR.
#   - pytest (contract validators + layering guardrail)
#   - lint-imports (audit P2 one-way layering, machine-enforced)
# Matrix is ubuntu + macos per ROADMAP; the Windows adapter is tested on
# real hardware initially (see DESIGN.md "Testing").

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Shim contract tests are Linux-gated (register needs the Linux
      # boot adapter until the macOS adapter lands in Phase 2). Install
      # zsh + fish on the Linux runner so all three shims are actually
      # exercised there, not silently skipped.
      - name: Install shells for shim tests (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish

      - name: Install (dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Layering contract (import-linter)
        run: lint-imports

      - name: Tests
        run: pytest -q

  # Page-JS syntax gate (DESIGN.md: "a served page is not verifiable by
  # curl"). Now that a page exists, the real gate is a pytest test
  # (test_web.py::test_page_scripts_pass_node_check) that extracts every
  # <script> block and runs `node --check`; it runs in the matrix job above
  # (the runners ship node). This job is a redundant explicit check on
  # ubuntu so a node regression is obvious in the checks list.
  page-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: node --check every served <script> block
        run: |
          node --version
          pytest -q tests/test_web.py -k node_check
