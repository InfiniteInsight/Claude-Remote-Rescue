<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude-Remote-Rescue</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 15px/1.4 system-ui, -apple-system, sans-serif;
    background: #0f1115; color: #e6e6e6;
  }
  header {
    padding: 12px 16px; border-bottom: 1px solid #262b36;
    display: flex; align-items: baseline; gap: 12px; position: sticky; top: 0;
    background: #0f1115;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .meta { color: #8a93a2; font-size: 12px; }
  #key { display: flex; gap: 10px; flex-wrap: wrap; padding: 8px 16px; font-size: 12px; color: #8a93a2; }
  #key span::before {
    content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 5px; vertical-align: middle;
  }
  .k-live::before { background: #46c26a; }
  .k-ghost::before { background: #e0a53b; }
  .k-crashed::before { background: #e05252; }
  .k-tight::before { background: #e0a53b; }
  .k-will-compact::before { background: #e05252; }
  #key .k-note::before { content: none; margin-right: 0; }
  #controls { display: flex; gap: 16px; padding: 0 16px 8px; font-size: 12px; color: #8a93a2; align-items: center; }
  #controls select {
    font: inherit; font-size: 12px; margin-left: 4px; padding: 3px 6px; border-radius: 6px;
    background: #1c222c; color: #cdd3dd; border: 1px solid #2f3745;
  }
  #sessions { padding: 8px 16px 40px; display: grid; gap: 10px; }
  .group-head {
    display: flex; align-items: center; gap: 8px; margin-top: 6px; padding-left: 10px;
    border-left: 3px solid #444; font-family: ui-monospace, monospace; font-size: 12px; color: #b9c1cf;
    word-break: break-all;
  }
  .group-head .gcount { color: #6b7280; }
  .gdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; vertical-align: middle; }
  .card {
    border: 1px solid #262b36; border-radius: 10px; padding: 12px 14px; background: #161a22;
  }
  .card.dup { border-left: 3px solid #6f7cf5; }
  .card.dup-uncertain { border-left-color: #e0a53b; }
  .card .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .id { font-family: ui-monospace, monospace; font-size: 13px; color: #b9c1cf; }
  .badge {
    margin-left: auto; font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
    padding: 2px 8px; border-radius: 999px; font-weight: 600;
  }
  .badge.live { background: #123a22; color: #46c26a; }
  .badge.ghost { background: #3a2f12; color: #e0a53b; }
  .badge.crashed { background: #3a1616; color: #e05252; }
  .badge.dup-badge { margin-left: 8px; background: #1e2740; color: #9fb0f5; text-transform: none; letter-spacing: 0; }
  .badge.dup-badge.uncertain { background: #3a2f12; color: #e0a53b; }
  .badge.pressure-tight { margin-left: 8px; background: #3a2f12; color: #e0a53b; text-transform: none; letter-spacing: 0; }
  .badge.pressure-will-compact { margin-left: 8px; background: #3a1616; color: #e05252; text-transform: none; letter-spacing: 0; }
  .badge.latest-badge { margin-left: 8px; background: #123a3a; color: #46c2b0; text-transform: none; letter-spacing: 0; }
  .cwd { color: #8a93a2; font-size: 12px; margin-top: 6px; font-family: ui-monospace, monospace; word-break: break-all; }
  .time { color: #8a93a2; font-size: 12px; margin-top: 4px; }
  .time:empty { display: none; }
  .model {
    display: inline-block; margin-top: 6px; font-family: ui-monospace, monospace; font-size: 11px;
    color: #9fb0f5; background: #1a2030; padding: 1px 8px; border-radius: 999px;
  }
  .prompt { margin-top: 6px; color: #cdd3dd; font-size: 13px; }
  .prompt:empty { display: none; }
  .src { font-size: 11px; color: #6b7280; margin-left: 6px; }
  .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  button {
    font: inherit; font-size: 12px; padding: 6px 14px; border-radius: 6px;
    border: 1px solid #2f3745; background: #1c222c; color: #cdd3dd; cursor: pointer;
  }
  button:hover { background: #232b37; }
  button:disabled { opacity: .5; cursor: default; }
  button.danger { color: #e0857f; }
  #empty, #stale { color: #8a93a2; padding: 20px 16px; }
  #stale { color: #e0a53b; display: none; }
  #notice {
    position: sticky; top: 49px; margin: 0 16px; padding: 8px 12px; border-radius: 8px;
    background: #3a2f12; color: #e0a53b; font-size: 13px; display: none;
  }
  #diag { padding: 4px 16px 0; }
  #diag-btn {
    font: inherit; font-size: 12px; padding: 5px 12px; border-radius: 6px;
    border: 1px solid #2f3745; background: #1c222c; color: #8a93a2; cursor: pointer;
  }
  #diag-panel {
    margin-top: 8px; padding: 10px 12px; border: 1px solid #262b36; border-radius: 8px;
    background: #161a22; font-size: 12px;
  }
  #diag-panel h3 { margin: 8px 0 4px; font-size: 12px; color: #8a93a2; font-weight: 600; }
  #diag-panel .ev { font-family: ui-monospace, monospace; color: #cdd3dd; margin: 3px 0; word-break: break-word; }
  #diag-panel .verdict { color: #f0d886; margin: 6px 0; line-height: 1.4; border-left: 3px solid #6b5d2f; padding-left: 8px; }
</style>
</head>
<body>
<header>
  <h1>Claude-Remote-Rescue</h1>
  <span class="meta" id="count"></span>
</header>
<div id="key">
  <span class="k-live">live</span>
  <span class="k-ghost">ghost</span>
  <span class="k-crashed">crashed</span>
  <span class="k-tight">context tight</span>
  <span class="k-will-compact">will compact on revive</span>
  <span class="k-note">context badges are an estimate (byte-size / model-window heuristic, not exact)</span>
</div>
<div id="controls">
  <label>Show
    <select id="filter">
      <option value="all">All</option>
      <option value="crashed">Crashed</option>
      <option value="active">Not crashed</option>
    </select>
  </label>
  <label>Sort
    <select id="sort">
      <option value="updated">Recent</option>
      <option value="state">State</option>
      <option value="cwd">Directory</option>
      <option value="pid">PID</option>
    </select>
  </label>
  <label>Group
    <select id="group">
      <option value="none">None</option>
      <option value="cwd">Directory</option>
      <option value="host">Host</option>
      <option value="model">Model</option>
    </select>
  </label>
</div>
<div id="stale">A newer version is available — reloading…</div>
<div id="notice"></div>
<div id="diag">
  <button id="diag-btn" type="button">Why did sessions die?</button>
  <div id="diag-panel" hidden></div>
</div>
<div id="sessions"></div>
<div id="empty" style="display:none">No journaled sessions.</div>

<script>
"use strict";
// Baked at serve time; compared against /api/version to self-heal a cached page.
var PAGE_VERSION = "@PAGE_VERSION@";
var POLL_MS = @POLL_MS@;
var VERSION_MS = @VERSION_MS@;
var CONFIRM_ARM_MS = @CONFIRM_ARM_MS@;
var NOTICE_MS = @NOTICE_MS@;
var RELOAD_DELAY_MS = @RELOAD_DELAY_MS@;
var DIAG_ERR_CAP = @DIAG_ERR_CAP@;

function el(tag, cls) { var e = document.createElement(tag); if (cls) e.className = cls; return e; }

// View state (filter/sort/group), persisted across polls so a poll keeps the view.
var filterKey = "all", sortKey = "updated", groupKey = "none", lastSessions = [];

// The single confirm-gated button currently armed (first click), or null.
// Module-level (not a per-button closure) so it survives render()'s full
// card rebuild on the next poll tick instead of silently discarding the
// armed state mid-window; renderCard reads it to restore the "Confirm
// ...?" label across a rebuild. {pid, op} — matched by both fields.
var confirmArmed = null;

function passesFilter(s) {
  if (filterKey === "crashed") return s.state === "crashed";
  if (filterKey === "active") return s.state !== "crashed";
  return true;  // "all"
}
var STATE_ORDER = { crashed: 0, ghost: 1, live: 2 };  // crashed floats to the top

// Stable color per group key (cwd/host): hash -> hue. Deterministic, no state.
function colorFor(key) {
  var h = 0;
  for (var i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0;
  return "hsl(" + (h % 360) + ", 55%, 62%)";
}

// T-A: true recency. `last_active` (conversation activity, from the newest
// transcript turn) is the honest signal; `updated` (shell-prompt activity,
// written by the shim on register/last-cmd) is only a fallback for sessions
// where the transcript tail hasn't been read yet (last_active === "").
function recencyKey(s) {
  return s.last_active || s.updated;
}

// Numeric epoch-ms form of recencyKey, for ordering/comparison. `last_active`
// and `updated` come from two independent producers (transcript "timestamp"
// field vs. the shim's datetime.now(...).isoformat()) that emit different-
// but-both-valid ISO serializations (e.g. "...Z" vs "...+00:00", with or
// without a fractional-second component) — raw string comparison across
// those formats is not reliably order-preserving, so parse to a number
// before comparing. Unknown/unparseable timestamps sort oldest (never win
// a "latest" tie or float to the top of "Recent").
function recencyMs(s) {
  var t = Date.parse(recencyKey(s));
  return isNaN(t) ? -Infinity : t;
}

// Relative-time display for a card's last activity. Returns "" (renders as
// nothing, see .time:empty) when there is no timestamp to work with at all.
function relTime(iso) {
  if (!iso) return "";
  var t = Date.parse(iso);
  if (isNaN(t)) return "";
  var diffSec = Math.floor((Date.now() - t) / 1000);
  if (diffSec < 60) return "just now";
  var diffMin = Math.floor(diffSec / 60);
  if (diffMin < 60) return diffMin + "m ago";
  var diffHr = Math.floor(diffMin / 60);
  if (diffHr < 24) return diffHr + "h ago";
  var diffDay = Math.floor(diffHr / 24);
  return diffDay + "d ago";
}

function sortSessions(arr) {
  return arr.slice().sort(function (x, y) {
    if (sortKey === "state") return (STATE_ORDER[x.state] - STATE_ORDER[y.state]) || (x.pid - y.pid);
    if (sortKey === "cwd") return x.cwd < y.cwd ? -1 : x.cwd > y.cwd ? 1 : (x.pid - y.pid);
    if (sortKey === "pid") return x.pid - y.pid;
    return recencyMs(y) - recencyMs(x);  // "Recent" desc, by true recency (T-A)
  });
}

// T-B: per-cwd "latest" marker. Only meaningful when a cwd has more than one
// session (otherwise every card would trivially be "latest"); flags the
// max-recencyMs card(s) in each cwd so a stale duplicate is obvious.
// Computed over ALL sessions (not just the visible/filtered set), same
// rationale as uncertainGroups: a filtered view shouldn't change the truth.
function latestPerCwd(sessions) {
  var byCwd = {};
  sessions.forEach(function (s) {
    var rk = recencyMs(s);
    var entry = byCwd[s.cwd];
    if (!entry) { entry = byCwd[s.cwd] = { max: rk, count: 0 }; }
    entry.count++;
    if (rk > entry.max) entry.max = rk;
  });
  return byCwd;
}

function groupValue(s) {
  if (groupKey === "host") return s.host;
  // Honest "unknown" header when no assistant turn / model was read yet,
  // rather than an empty chip (same rule as the "" last_prompt default).
  if (groupKey === "model") return s.model || "(unknown model)";
  return s.cwd;
}

// Audit P3 weighting: a duplicate group is only a CERTAIN collision when every
// member's sid is injected/verified. If any member's sid is `guessed`, the
// shared id may be a laundered guess (two tabs guessing the same newest
// transcript), so the group is shown as UNCERTAIN rather than presented as
// truth. The provenance (sid_source) is on each card; the weighting is here.
function uncertainGroups(sessions) {
  var groups = {}, uncertain = {};
  sessions.forEach(function (s) {
    if (s.duplicate_group) (groups[s.duplicate_group] = groups[s.duplicate_group] || []).push(s);
  });
  Object.keys(groups).forEach(function (g) {
    uncertain[g] = groups[g].some(function (s) { return s.sid_source === "guessed"; });
  });
  return uncertain;
}

// Untrusted fields (cwd, last_prompt, ids) reach the DOM via textContent ONLY.
function renderCard(s, uncertain, groupColor, latest) {
  var isDup = !!s.duplicate_group;
  var isUncertain = isDup && uncertain[s.duplicate_group];
  var card = el("div", "card" + (isDup ? (isUncertain ? " dup dup-uncertain" : " dup") : ""));
  var top = el("div", "top");
  if (groupColor) {  // a group dot, distinct from the duplicate left-border channel
    var gd = el("span", "gdot");
    gd.style.background = groupColor;
    top.appendChild(gd);
  }
  var id = el("span", "id");
  id.textContent = "#" + s.pid + " · " + s.sid8;
  var src = el("span", "src");
  src.textContent = s.sid_source;
  id.appendChild(src);
  top.appendChild(id);
  var badge = el("span", "badge " + s.state);
  badge.textContent = s.state;
  top.appendChild(badge);
  if (isDup) {
    var dup = el("span", "badge dup-badge" + (isUncertain ? " uncertain" : ""));
    dup.textContent = isUncertain ? "possible duplicate · guessed sid" : "duplicate";
    top.appendChild(dup);
  }
  // F2: compaction badge from context_pressure. "ok" renders nothing (no
  // clutter on the common case); tight/will-compact get a chip. Estimate —
  // see the #key legend note.
  if (s.context_pressure === "tight") {
    var pb = el("span", "badge pressure-tight");
    pb.textContent = "context tight";
    top.appendChild(pb);
  } else if (s.context_pressure === "will-compact") {
    var pb2 = el("span", "badge pressure-will-compact");
    pb2.textContent = "will compact on revive";
    top.appendChild(pb2);
  }
  // T-B: latest-per-cwd marker.
  var cwdInfo = latest && latest[s.cwd];
  if (cwdInfo && cwdInfo.count > 1 && recencyMs(s) === cwdInfo.max) {
    var lb = el("span", "badge latest-badge");
    lb.textContent = "latest";
    top.appendChild(lb);
  }
  card.appendChild(top);
  var cwd = el("div", "cwd");
  cwd.textContent = s.cwd;
  card.appendChild(cwd);
  // T-A: relative-time display of true recency (last_active, fallback updated).
  var time = el("div", "time");
  time.textContent = relTime(recencyKey(s));
  card.appendChild(time);
  if (s.model) {  // model id from the transcript — untrusted -> textContent
    var model = el("div", "model");
    model.textContent = s.model;
    card.appendChild(model);
  }
  var prompt = el("div", "prompt");
  prompt.textContent = s.last_prompt || "";
  card.appendChild(prompt);

  var actions = el("div", "actions");
  function addBtn(label, op, danger, confirm) {
    var b = el("button", danger ? "danger" : "");
    var isArmed = function () {
      return !!confirmArmed && confirmArmed.pid === s.pid && confirmArmed.op === op;
    };
    b.textContent = isArmed() ? ("Confirm " + label + "?") : label;
    b.addEventListener("click", function () {
      if (confirm) {
        if (!isArmed()) {
          confirmArmed = { pid: s.pid, op: op };
          b.textContent = "Confirm " + label + "?";
          setTimeout(function () {
            if (isArmed()) { confirmArmed = null; }
            b.textContent = label;  // harmless if this button was since rebuilt
          }, CONFIRM_ARM_MS);
          return;
        }
        // Firing the confirmed second click: reset the arm state FIRST, so
        // a failed/incomplete op (or a poll that never lands) never leaves
        // a stale armed button that a later ordinary click could fire
        // without reconfirming.
        confirmArmed = null;
        b.textContent = label;
      }
      action(op, s.pid, b);
    });
    actions.appendChild(b);
  }
  if (s.state === "crashed") {
    addBtn("Reopen", "reopen", false, false);
    addBtn("Dismiss", "dismiss", false, false);
    if (s.tmux_session) {        // revived into tmux: offer re-homing
      addBtn("Untrack", "detmux", false, false);
      // kills the tmux session and relaunches `claude --resume` directly
      // in a visible tab -- confirm-gated (second click) since it kills.
      addBtn("Un-tmux", "untmux", true, true);
    }
  } else {                       // live or ghost: a running claude to act on
    if (s.state === "ghost") {   // orphaned shell: offer mobile rescue
      addBtn("Restore", "reopen", false);
    }
    addBtn("Kick", "kick", false);
    addBtn("Close", "close", true);
  }
  addBtn("Remove", "remove", true);
  card.appendChild(actions);
  return card;
}

function showNotice(text) {
  var n = document.getElementById("notice");
  n.textContent = text;
  n.style.display = "block";
  setTimeout(function () { n.style.display = "none"; }, NOTICE_MS);
}

function action(op, pid, btn) {
  btn.disabled = true;
  fetch("/api/action", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ op: op, pid: pid })
  })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j.ok) { showNotice(j.message || "action failed"); }
      pollSessions();
    })
    .catch(function () { showNotice("request failed"); })
    .finally(function () { btn.disabled = false; });
}

// render(payload) on a poll; render(null) to re-apply sort/group to the cached
// sessions without a fetch (control changes).
function render(payload) {
  if (payload) lastSessions = (payload.sessions) || [];
  var total = lastSessions;
  var visible = total.filter(passesFilter);
  var list = document.getElementById("sessions");
  list.textContent = "";
  document.getElementById("count").textContent = visible.length === total.length
    ? total.length + (total.length === 1 ? " session" : " sessions")
    : visible.length + " of " + total.length + " sessions";
  var empty = document.getElementById("empty");
  if (!visible.length) {
    empty.textContent = total.length ? "No sessions match this filter." : "No journaled sessions.";
    empty.style.display = "block";
  } else {
    empty.style.display = "none";
  }

  // Weighting is computed over ALL sessions (not just visible) so a filtered
  // view still shows a duplicate's true certain/uncertain status. Same
  // rationale for the per-cwd "latest" marker (T-B).
  var uncertain = uncertainGroups(total);
  var latest = latestPerCwd(total);
  var sorted = sortSessions(visible);
  if (groupKey === "none") {
    sorted.forEach(function (s) { list.appendChild(renderCard(s, uncertain, null, latest)); });
    return;
  }
  // Group, preserving group order by first appearance in the sorted list.
  var order = [], groups = {};
  sorted.forEach(function (s) {
    var k = groupValue(s);
    if (!groups[k]) { groups[k] = []; order.push(k); }
    groups[k].push(s);
  });
  order.forEach(function (k) {
    var color = colorFor(k);
    var head = el("div", "group-head");
    head.style.borderLeftColor = color;
    var dot = el("span", "gdot"); dot.style.background = color; head.appendChild(dot);
    var lbl = el("span"); lbl.textContent = k; head.appendChild(lbl);  // cwd/host -> textContent
    var cnt = el("span", "gcount"); cnt.textContent = "(" + groups[k].length + ")"; head.appendChild(cnt);
    list.appendChild(head);
    groups[k].forEach(function (s) { list.appendChild(renderCard(s, uncertain, color, latest)); });
  });
}

function pollSessions() {
  fetch("/api/sessions", { headers: { "Accept": "application/json" } })
    .then(function (r) { return r.json(); })
    .then(render)
    .catch(function () { /* transient; next tick retries */ });
}

function pollVersion() {
  fetch("/api/version")
    .then(function (r) { return r.json(); })
    .then(function (v) {
      if (String(v.version) !== PAGE_VERSION) {
        document.getElementById("stale").style.display = "block";
        setTimeout(function () { location.reload(); }, RELOAD_DELAY_MS);
      }
    })
    .catch(function () {});
}

// Lazy diagnostics panel — fetched only on open, never on the poll path.
var diagLoaded = false;
function renderDiag(d) {
  var panel = document.getElementById("diag-panel");
  panel.textContent = "";
  // Lineage first (F12): which source answered, and its current boot
  // identity, so a verdict is never read without knowing where it came
  // from. Untrusted/server-derived fields -> textContent only.
  var meta = el("div", "ev");
  var metaText = "source: " + d.source;
  if (d.boots && d.boots.length) {
    var b0 = d.boots[0];
    metaText += " · boot " + b0.boot_id + " (start " + b0.start + ")";
  }
  meta.textContent = metaText;
  panel.appendChild(meta);
  if (d.degraded && d.degraded.length) {
    var warn = el("div", "ev");
    warn.textContent = "degraded sources: " + d.degraded.join(", ");
    panel.appendChild(warn);
  }
  // Plain-English verdict first — the "why", above the raw evidence.
  var summary = d.summary || [];
  summary.forEach(function (sentence) {
    var s = el("div", "verdict");
    s.textContent = sentence;  // trusted server text, still textContent
    panel.appendChild(s);
  });
  var h1 = el("h3");
  h1.textContent = "raw evidence — host death / shutdown / OOM (previous boot)";
  panel.appendChild(h1);
  var events = d.host_events || [];
  if (!events.length) {
    var none = el("div", "ev");
    none.textContent = "none found";
    panel.appendChild(none);
  } else {
    events.forEach(function (line) {
      var e = el("div", "ev");
      e.textContent = line;  // untrusted log text -> textContent
      panel.appendChild(e);
    });
  }
  var errs = d.prev_boot_errors || [];
  var h2 = el("h3");
  h2.textContent = "previous-boot errors (" + errs.length + ")";
  panel.appendChild(h2);
  errs.slice(0, DIAG_ERR_CAP).forEach(function (line) {
    var e = el("div", "ev");
    e.textContent = line;
    panel.appendChild(e);
  });
}
document.getElementById("diag-btn").addEventListener("click", function () {
  var panel = document.getElementById("diag-panel");
  if (!panel.hidden) { panel.hidden = true; return; }
  panel.hidden = false;
  if (diagLoaded) { return; }
  panel.textContent = "loading…";
  fetch("/api/diagnostics")
    .then(function (r) { return r.json(); })
    .then(function (d) { renderDiag(d); diagLoaded = true; })
    .catch(function () { panel.textContent = "diagnostics unavailable"; });
});

document.getElementById("filter").addEventListener("change", function () { filterKey = this.value; render(null); });
document.getElementById("sort").addEventListener("change", function () { sortKey = this.value; render(null); });
document.getElementById("group").addEventListener("change", function () { groupKey = this.value; render(null); });

pollSessions();
pollVersion();
setInterval(pollSessions, POLL_MS);
setInterval(pollVersion, VERSION_MS);
</script>
</body>
</html>
